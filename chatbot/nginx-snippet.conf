# Add this location block inside the existing
# /etc/nginx/sites-enabled/realio-docs.decentrio.ventures server{} block,
# above the closing brace of the file (after the `location / { ... }` block).

    location /api/chat {
        # OPTIONS is required for cross-origin browsers to send their CORS
        # preflight before the real POST (flask-cors handles the response)
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8000/api/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 200k;
        # responses are streamed (NDJSON) - don't let nginx buffer the
        # whole thing before forwarding, or streaming is pointless
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
