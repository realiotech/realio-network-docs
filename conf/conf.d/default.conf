server {
  listen 8080;
  # Emit relative Location headers. Absolute ones are built from this listen
  # port, so directory redirects would send clients to
  # http://docs.realio.network:8080/... behind the TLS gateway.
  absolute_redirect off;
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
